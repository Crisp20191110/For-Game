<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142d2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="招募群仙，五人结阵。原创仙侠抽卡与机器人队伍 PK。">
  <title>一叶问仙 · 万仙图录</title>
  <link rel="icon" href="./public/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./public/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./public/game.css?v=4.0.0">

  <style>
    #boot-screen{position:fixed;inset:0;z-index:100;background:#122e2c;color:#eee4c2;display:grid;place-items:center;font:16px/1.9 -apple-system,sans-serif;text-align:center;padding:28px}#boot-screen .boot-emblem{font:64px serif;color:#cfb46d}#boot-screen button,#boot-screen a{display:inline-block;background:#d7bd7f;color:#173b35;padding:12px 18px;margin:8px;border:0;border-radius:8px;font:inherit;text-decoration:none}#boot-error{max-width:440px}#boot-error[hidden]{display:none}
  </style>
  <script>
    window.__gameReady=false;
    window.__gameFail=function(){if(window.__gameReady)return;var loader=document.getElementById('boot-loading'),error=document.getElementById('boot-error');if(loader)loader.hidden=true;if(error)error.hidden=false;};
    window.addEventListener('error',function(e){if(e.target&&(/SCRIPT|LINK/.test(e.target.tagName)||e.message))window.__gameFail();},true);
    window.addEventListener('unhandledrejection',function(){window.__gameFail();});
    setTimeout(window.__gameFail,12000);
  </script>
</head>
<body>
  <div id="boot-screen" role="status"><div><div class="boot-emblem">✦</div><h1>一叶问仙</h1><p id="boot-loading">正在铺开万仙图录…</p><div id="boot-error" hidden><h2>游戏资源未能完整加载</h2><p>请确认上传了整个解压文件夹，而不只是 HTML。若在文件预览中打开，请用 Safari 访问部署后的网址。</p><button onclick="location.reload()">重新加载</button><a href="./play.html">打开完整单文件版</a><p>你的存档不会被清除。</p></div><noscript>请在 Safari 设置中启用 JavaScript，再重新加载游戏。</noscript></div></div>
  <div class="shell">
    <aside class="desktop-note"><div class="seal">一叶</div><h1>山中无甲子<br>一叶问长生</h1><p>放下片刻尘嚣，来此间修行。</p><span>一叶问仙 / ONE LEAF IMMORTAL</span></aside>
    <main class="game">
      <header class="topbar"><a class="brand" href="./">一叶问仙<small>万仙图录 · v4.0</small></a><button class="icon-button" id="settings" aria-label="打开设置">☰</button></header>
      <section class="profile"><div class="avatar">仙</div><div class="identity"><h2>青岚仙盟 <span id="realm">5/36 英雄</span></h2><p>五人结阵 · 共赴山海</p></div><div class="power"><small>战力</small><strong id="power">108</strong></div></section>
      <section class="resources"><div><span class="resource-icon gold">◈</span><span>灵玉 <b id="coins">∞</b></span></div><div><span class="resource-icon jade">❧</span><span>招募券 <b id="fruit">∞</b></span><small id="regen">无限招募 · 无充值</small></div></section>
      <div id="page"></div>
      <nav class="bottom-nav" aria-label="游戏导航">
        <button data-tab="summon" class="active"><span>✦</span>召唤</button>
        <button data-tab="heroes"><span>♙</span>英雄</button>
        <button data-tab="team"><span>❖</span>布阵</button>
        <button data-tab="arena"><span>⚔</span>争锋</button>
        <button data-tab="journey"><span>♧</span>历练<i id="quest-dot" hidden></i></button>
      </nav>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script defer src="./public/game.js?v=4.0.0"></script>
</body>
</html>
