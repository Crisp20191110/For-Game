)?'退出阵容':'加入阵容','toggleTeam','ghost')}${btn('查看法宝与装备','heroHome','primary')}</div>`:''}`}
else if(modal==='bag'){out=`<div class="modal-head"><h2>📦 装备背包</h2><button class="x" data-act="close">关闭 ✕</button></div><p class="footnote">共有${S.gear.length}件仙装。点击装备为当前选中的神将穿戴。</p><div class="geargrid">${S.gear.length?S.gear.map(g=>`<div class="gear"><div style="font-size:28px">${ICONS[g.slot]}</div><strong>${gearName(g)}</strong><p>强化+${g.level} · ${TYPES[g.slot]}</p>${btn('穿戴此装备','equip','small',`data-id="${g.id}"`)}</div>`).join(''):'还没有仙装。请先到炼器炉锻造。'}</div>`}
else if(modal==='chooseGear'){let list=S.gear.filter(g=>g.slot===chooseSlot);out=`<div class="modal-head"><h2>${TYPES[chooseSlot]} · 选择装备</h2><button class="x" data-act="close">关闭 ✕</button></div><p class="footnote">为「${HEROS[selected].name}」选择装备。每件装备只能由一位神将穿戴。</p><div class="geargrid">${list.length?list.map(g=>`<div class="gear"><div style="font-size:29px">${ICONS[g.slot]}</div><strong>${gearName(g)}</strong><p>强化 +${g.level}/20 ${gearHolder(g.id)}</p>${btn('穿戴','equip','small',`data-id="${g.id}"`)}</div>`).join(''):'暂无此部位装备，去炼器炉锻造吧。'}</div>`}
else if(modal==='beast'){let b=BEASTS[beastIndex],u=S.beasts[beastIndex];out=`<div class="modal-head"><h2>🐲 异兽契约</h2><button class="x" data-act="close">关闭 ✕</button></div><div style="font-size:89px;text-align:center">${b.icon}</div><h2 style="text-align:center">${b.name}</h2><p class="footnote" style="text-align:center">天赋 · ${b.skill}，战斗中每两回合额外施放${beastDesc(b.kind)}。</p>${u?`<div class="notice">Lv.${u.level}/30 · 同名兽魂：${u.shards} · 全队加成随等级提升</div><div class="actions">${btn('升阶 · 精魄'+(18+u.level*6),'beastUp','primary',u.level>=30?'disabled':'')}${btn(S.beastLine.includes(beastIndex)?'撤下异兽':'加入助阵','beastToggle','ghost')}</div>`:'<div class="notice">尚未契约，可通过异兽召唤获得。</div>'}`}
else if(modal==='beastDraw'){let b=BEASTS[beastIndex];out=`<div class="modal-head"><h2>异兽破界而来</h2><button class="x" data-act="close">关闭 ✕</button></div><div style="font-size:112px;text-align:center">${b.icon}</div><h2 style="text-align:center;color:#e8c27e">${b.name}</h2><p style="text-align:center">${b.skill}</p><p class="footnote" style="text-align:center">${beastResult==='dup'?'重复契约，获得20枚兽魂。':'成功获得新的异兽！前往异兽谱即可助阵。'}</p>${btn('查看异兽谱','close','primary')}`}

function effectDesc(h){let kind={aoe:'对所有敌人造成范围法术伤害',strike:'对一名敌人造成高额爆发伤害',chain:'连续追击多名敌人',wave:'掀起波澜，对敌方全体造成伤害',heal:'治疗生命最低的友军及其同伴',guard:'为全队生成保护屏障',control:'压制敌方目标并造成伤害',bless:'赋予全队增益并回复灵力',execute:'重创残血目标，伤害随其已损生命上升'};let fx={burn:'附加灼烧',mark:'施加易伤印记',stun:'概率眩晕',shock:'施加雷痹',revive:'可复苏倒下的队友',haste:'提升攻击和出手效率',shield:'追加护盾',weaken:'削弱敌方攻击',reflect:'附带反伤',silence:'概率沉默',bleed:'造成流血',regen:'持续恢复',pierce:'无视部分防御',freeze:'概率冻结',cleanse:'驱散负面状态',counter:'附加反击',charm:'魅惑敌方',sleep:'令敌方昏睡',drain:'吸取生命',poison:'持续中毒',break:'重击破甲'};return `${kind[h.kind]}，并${fx[h.fx]||'引动灵气'}。角色神通按自身攻击、星级、本命法宝等级计算。`}
function passiveDesc(s){return ({仁心:'治疗效果增强',巨力:'攻击额外增强',先机:'开局灵力领先',天道:'控制概率增强',剑意:'攻击可触发额外追击',道心:'全队防御加成',金身:'受到的伤害降低',钟魂:'开局护盾',战魂:'生命越低攻击越强',天眼:'暴击率提升',斗战:'技能有机会连击',军师:'全队灵力恢复更快',仙丹:'受到治疗效果增强',迅捷:'每回合灵力额外增加',帝威:'全队攻击提高',灵泉:'每回合小幅回血',神射:'技能伤害提高',月华:'清除自身异常',不屈:'首次死亡可保留1点生命',火魂:'灼烧伤害增强',水魄:'冻结效果概率提升',兵法:'对有印记目标增伤',丹道:'友军回复额外灵力',慈悲:'治疗量提高',宏愿:'自身血量加成',审判:'对残血敌人增伤',蛮劲:'生命值提高',风行:'闪避概率提升',魅影:'攻击有概率令敌人虚弱',忘忧:'控制概率提高',追魂:'攻击自带吸血',魂引:'首次治疗可复苏',坚毅:'护盾效果增强',逐日:'持续回复生命',镇压:'眩晕概率提高',骨灵:'中毒时间延长',灵火:'灼烧概率提升',巧心:'治疗自带护盾',蛮力:'攻击提高',福泽:'队伍少量恢复',水势:'法术伤害增加',逍遥:'每回合自净',夜袭:'暴击提高',山岳:'受到伤害降低'})[s]||'获得额外属性加成'}
function summon(n){let cost=n===10?1440:160, useT=Math.min(n,S.tickets),jadeCost=n===10?(useT===10?0:Math.ceil(cost*(n-useT)/n)):(useT?0:cost);if(S.jade<jadeCost){msg('仙玉不足！去征战赢取奖励');return}S.tickets-=useT;S.jade-=jadeCost;drawResults=[];for(let i=0;i<n;i++){S.pity++;S.mythPity++;S.draws++;let z=Math.random(),tier=z<.01?'神话':z<.06?'传说':z<.30?'史诗':'灵品';if(S.mythPity>=80)tier='神话';else if(S.pity>=30&&!['神话','传说'].includes(tier))tier='传说';if(tier==='神话'){S.mythPity=0;S.pity=0}else if(tier==='传说')S.pity=0;if(n===10&&i===9&&S.first&&!drawResults.some(o=>['神话','传说'].includes(HEROS[o.id].tier)))tier='传说';else if(n===10&&i===9&&drawResults.every(o=>HEROS[o.id].tier==='灵品'))tier='史诗';if(tier==='传说')S.pity=0;if(tier==='神话'){S.pity=0;S.mythPity=0}let h=pick(HEROS.filter(h=>h.tier===tier));let dup=!!S.units[h.id];if(dup)S.units[h.id].shards+=30;else S.units[h.id]={star:1,level:1,shards:0,artifact:0,gear:[null,null,null,null]};drawResults.push({id:h.id,dup})}if(n===10)S.first=false;modal='draw';render()}
function ascend(){let u=S.units[selected];if(!u)return;if(u.star>=30){msg('已达到30星最高境界');return}let cost=price(selected);if(u.shards+S.spirit<cost){msg(`神魂不足：还缺 ${cost-u.shards-S.spirit} 枚`);return}let self=Math.min(cost,u.shards);u.shards-=self;S.spirit-=cost-self;u.star++;msg(`${HEROS[selected].name} 升至 ${u.star} 星！`);render()}
function level(){let u=S.units[selected],cost=1300+u.level*110;if(u.level>=20+u.star*5){msg('已达等级上限，先升星');return}if(S.gold<cost){msg('铜钱不足，去征战获取');return}S.gold-=cost;u.level++;render()}
function toggleTeam(){if(!S.units[selected])return;let index=S.lineup.indexOf(selected);if(index>=0){if(S.lineup.length<=1){msg('至少保留一名神将');return}S.lineup.splice(index,1)}else if(S.lineup.length>=5){msg('最多上阵五位，请先撤下一位');return}else S.lineup.push(selected);msg('神阵已调整');render()}
function autoTeam(){S.lineup=Object.keys(S.units).map(Number).sort((a,b)=>power(b)-power(a)).slice(0,5);msg('最强五神已归位');render()}
function upArtifact(){let u=S.units[selected],cost=16+u.artifact*10;if(u.artifact>=30){msg('法宝已圆满');return}if(S.dust<cost){msg('灵材不足，征战有机会掉落');return}S.dust-=cost;u.artifact++;msg(`${HEROS[selected].artifact} 升至 ${u.artifact} 阶`);render()}
function forge(){if(S.gold<6000){msg('铜钱不足');return}S.gold-=6000;let z=Math.random(),rarity=z<.025?4:z<.15?3:z<.52?2:1,g={id:S.uid++,slot:rnd(4),rarity,level:1,seed:rnd(100)};S.gear.push(g);msg(`锻造出 ${gearName(g)}`);render()}
function gearHolder(id){for(let k in S.units){if(S.units[k].gear.includes(id))return '· '+HEROS[k].name+'穿戴中'}return '· 未穿戴'}
function equip(id){let g=S.gear.find(g=>g.id===id);if(!g)return;for(let key in S.units)S.units[key].gear=S.units[key].gear.map(slot=>slot===id?null:slot);S.units[selected].gear[g.slot]=id;modal='';msg('已穿戴 '+gearName(g));render()}
function upGear(slot){let u=S.units[selected],g=S.gear.find(g=>g.id===u.gear[slot]);if(!g)return;let cost=1800+(g.level*700);if(g.level>=20){msg('该装备已强化至20级');return}if(S.gold<cost){msg('铜钱不足');return}S.gold-=cost;g.level++;msg(`${TYPES[slot]} 强化至 +${g.level}`);render()}
function beastDesc(k){return ({ward:'护盾守护',strike:'暴击突袭',weaken:'削弱敌军',heal:'治疗回血',burn:'炎火灼烧',shield:'群体护盾',drain:'伤害吸血',energy:'补充全队灵力',haste:'增加攻击',poison:'群体毒伤'})[k]||'灵能加持'}
function beastDraw(){if(S.essence<100){msg('异兽精魄不足，征战获取');return}S.essence-=100;beastIndex=rnd(BEASTS.length);beastResult=S.beasts[beastIndex]?'dup':'new';if(beastResult==='dup')S.beasts[beastIndex].shards+=20;else S.beasts[beastIndex]={level:1,shards:10};modal='beastDraw';render()}
function beastUp(){let u=S.beasts[beastIndex];if(!u||u.level>=30){msg('异兽已达到30阶');return}let cost=18+u.level*6;if(S.essence<cost){msg('精魄不足');return}S.essence-=cost;u.level++;msg(`${BEASTS[beastIndex].name} 升至 ${u.level} 阶`);render()}
function beastToggle(){let index=S.beastLine.indexOf(beastIndex);if(index>=0)S.beastLine[index]=null;else{let free=S.beastLine.indexOf(null);if(free===-1){msg('双异兽位已满，先撤下一只');return}S.beastLine[free]=beastIndex}render()}
function autoBeast(){S.beastLine=Object.keys(S.beasts).map(Number).sort((a,b)=>S.beasts[b].level-S.beasts[a].level).slice(0,2);while(S.beastLine.length<2)S.beastLine.push(null);render()}
function addStatus(t,kind,n=2){t.status[kind]=Math.max(t.status[kind]||0,n)}function alive(list){return list.filter(x=>x.hp>0)}function lowest(list){return [...alive(list)].sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]}function damage(t,amount,log,source,ignore=false){if(!t||t.hp<=0)return 0;let shield=t.status['护盾值']||0,hit=Math.max(1,Math.floor(amount));if(shield&&!ignore){let absorbed=Math.min(shield,hit);t.status['护盾值']-=absorbed;hit-=absorbed}if(!ignore&&t.status['防护'])hit=Math.floor(hit*.76);if(!ignore&&t.status['易伤'])hit=Math.floor(hit*1.25);if(!ignore&&(t.passive==='金身'||t.passive==='山岳'||t.passive==='道心'))hit=Math.floor(hit*.91);if(!ignore&&t.passive==='风行'&&Math.random()<.12){log.push(`${t.name} 闪避了攻击`);return 0}t.hp=Math.max(0,t.hp-hit);if(hit>0)log.push(`${source} → ${t.name} 受到 ${nfmt(hit)} 伤害`);if(!t.enemy&&t.hp<=0&&t.passive==='不屈'&&!t.revived){t.hp=1;t.revived=true;log.push(`${t.name} 触发「不屈」保住最后一点生命！`)}return hit}
function heal(t,v,log,source){if(!t)return;let add=Math.min(t.max-t.hp,Math.floor(v));t.hp+=add;if(add>0)log.push(`${source} → ${t.name} 回复 ${nfmt(add)} 生命`)}
function startBattle(){if(!S.lineup.length){msg('至少上阵一位神将');return}battle=freshBattle();render()}
function beastPulse(b,log){for(let id of S.beastLine){if(id===null)continue;let pet=BEASTS[id],lv=S.beasts[id].level,good=alive(b.good),enemy=alive(b.enemy);if(!good.length||!enemy.length)break;let atk=80+lv*22+S.stage*3;if(pet.kind==='heal'){let x=lowest(good);heal(x,atk*2,log,`🐲${pet.name}`)}else if(pet.kind==='shield'||pet.kind==='ward'){good.forEach(x=>x.status['护盾值']=(x.status['护盾值']||0)+atk);log.push(`🐲${pet.name} 为全队加持护盾`)}else if(pet.kind==='energy'||pet.kind==='haste'){good.forEach(x=>x.energy=Math.min(100,x.energy+27));log.push(`🐲${pet.name} 恢复全队灵力`)}else{let t=pick(enemy);damage(t,atk*(pet.kind==='strike'?3:2),log,`🐲${pet.name}`);if(pet.kind==='burn')addStatus(t,'灼烧',2);if(pet.kind==='poison')addStatus(t,'中毒',2);if(pet.kind==='weaken')addStatus(t,'虚弱',2)}}}
function doTurn(b){if(b.over)return;let log=b.log;b.round++;log.push(`—— 第 ${b.round} 回合 ——`);for(let side of [b.good,b.enemy]){for(let actor of [...side]){if(actor.hp<=0)continue;let foes=side===b.good?b.enemy:b.good,friends=side;if(!alive(foes).length)break;for(let s of ['灼烧','中毒','流血'])if(actor.status[s]>0){let hit=Math.max(15,actor.max*(s==='灼烧'?.034:.025));damage(actor,hit,log,s,true)}if(actor.hp<=0)continue;if((actor.status['眩晕']||actor.status['冻结']||actor.status['昏睡'])>0){log.push(`${actor.name} 被控制，无法行动`);tickStatus(actor);continue}if(actor.status['再生']||actor.passive==='灵泉'||actor.passive==='逐日'||actor.passive==='福泽')heal(actor,actor.max*.045,log,`${actor.name}·再生`);if(actor.passive==='月华'||actor.passive==='逍遥')if(Math.random()<.35)['沉默','灼烧','流血','中毒','虚弱','冻结'].forEach(s=>delete actor.status[s]);let use=actor.energy>=100&&!actor.status['沉默'];if(use){actor.energy=0;cast(actor,foes,friends,log)}else{let enemy=lowest(foes);if(!enemy)break;let multiplier=actor.status['虚弱']?.72:1;let crit=Math.random()<(actor.passive==='天眼'||actor.passive==='夜袭'?.3:.12);let val=actor.atk*multiplier*(crit?1.65:1)*(.83+Math.random()*.28)*(actor.status['增攻']?1.18:1);damage(enemy,val,log,`${actor.name}${crit?'·暴击':'·普攻'}`);actor.energy=Math.min(100,actor.energy+48+(actor.passive==='迅捷'||actor.passive==='军师'?12:0));if(actor.passive==='追魂')heal(actor,val*.24,log,'追魂吸血')}tickStatus(actor)}}if(b.round%2===0&&!b.over)beastPulse(b,log);let g=alive(b.good).length,e=alive(b.enemy).length;if(!g||!e||b.round>=38){b.over=true;b.win=e===0||(b.round>=38&&g>e);if(b.win){let j=260+S.stage*38,gold=4200+S.stage*350;S.jade+=j;S.gold+=gold;S.spirit+=7+Math.ceil(S.stage/2);S.dust+=8+Math.ceil(S.stage/3);S.essence+=15+Math.ceil(S.stage/3);S.victories++;log.push(`🏆 凯旋！仙玉+${j}、铜钱+${gold}、通用神魂+${7+Math.ceil(S.stage/2)}、灵材与异兽精魄入库。`);if(Math.random()<.37){let g={id:S.uid++,slot:rnd(4),rarity:pick([1,1,2,2,3]),level:1,seed:rnd(100)};S.gear.push(g);log.push(`🎁 掉落仙装：${gearName(g)}`)}S.stage++}else log.push('💀 神阵败退，升级后可以再次挑战。')}else if(log.length>130)log.splice(0,log.length-90)}
function tickStatus(actor){for(let k of Object.keys(actor.status))if(k!=='护盾值'){actor.status[k]--;if(actor.status[k]<=0)delete actor.status[k]}}
function cast(a,foes,friends,log){let aliveEnemy=alive(foes),aliveFriends=alive(friends);if(!aliveEnemy.length)return;let power=a.atk*(1+((!a.enemy&&S.units[a.id])?S.units[a.id].artifact*.018:0))*(a.status['增攻']?1.18:1),target=lowest(aliveEnemy);if(a.passive==='神射'||a.passive==='审判')power*=1.15;log.push(`✨ ${a.name} 施展「${a.skill}」！`);let hit=(t,mult)=>damage(t,power*mult*(.88+Math.random()*.22)*(a.status['虚弱']?.73:1),log,a.skill);switch(a.kind){case 'heal':{let t=lowest(aliveFriends);if(t)heal(t,power*3.4*(['仁心','慈悲','灵泉'].includes(a.passive)?1.22:1),log,a.skill);aliveFriends.filter(x=>x!==t).sort((x,y)=>x.hp/x.max-y.hp/y.max).slice(0,2).forEach(x=>heal(x,power*1.5,log,a.skill));break}case 'guard':aliveFriends.forEach(x=>{x.status['护盾值']=(x.status['护盾值']||0)+Math.round(power*1.2);addStatus(x,'防护',2)});log.push('全队受到护盾与防护的庇佑');break;case 'bless':aliveFriends.forEach(x=>{x.energy=Math.min(100,x.energy+30);addStatus(x,'增攻',2);if(a.fx==='shield')x.status['护盾值']=(x.status['护盾值']||0)+power});log.push('全队增攻、灵力上涨');break;case 'execute':hit(target,2.7+(1-target.hp/target.max)*2);break;case 'strike':hit(target,a.fx==='pierce'?4.2:3.3);break;case 'control':hit(target,1.5);break;case 'chain':for(let i=0;i<3;i++)if(alive(foes).length)hit(pick(alive(foes)),1.32);break;case 'wave':case 'aoe':aliveEnemy.forEach(t=>hit(t,a.kind==='wave'?1.4:1.6));break}let applies=(a.kind==='wave'||a.kind==='aoe')?alive(foes):[lowest(foes)].filter(Boolean);let statusMap={burn:'灼烧',bleed:'流血',poison:'中毒',freeze:'冻结',stun:'眩晕',shock:'眩晕',silence:'沉默',sleep:'昏睡',charm:'虚弱',weaken:'虚弱',mark:'易伤',break:'虚弱',drain:'流血'};let status=statusMap[a.fx];if(status)applies.forEach(t=>{if(Math.random()<(.5+(a.passive==='天道'||a.passive==='镇压'?.25:0)))addStatus(t,status,status==='眩晕'||status==='冻结'||status==='昏睡'?1:2)});if(a.fx==='shield')aliveFriends.forEach(t=>t.status['护盾值']=(t.status['护盾值']||0)+Math.floor(power*.6));if(a.fx==='cleanse')aliveFriends.forEach(t=>{['灼烧','流血','中毒','冻结','沉默','眩晕','虚弱','昏睡'].forEach(s=>delete t.status[s])});if(a.fx==='regen')aliveFriends.forEach(t=>addStatus(t,'再生',3));if(a.fx==='haste')aliveFriends.forEach(t=>t.energy=Math.min(100,t.energy+24));if(a.fx==='revive'){let dead=friends.find(t=>t.hp<=0&&!t.revived);if(dead){dead.revived=true;dead.hp=Math.floor(dead.max*.33);log.push(`🌸 ${dead.name} 被复活！`)}}if(a.fx==='drain')heal(a,power*.7,log,a.skill);if(a.passive==='巧心'||a.passive==='坚毅')aliveFriends.forEach(t=>t.status['护盾值']=(t.status['护盾值']||0)+Math.floor(power*.3));if(a.passive==='斗战'&&Math.random()<.28&&alive(foes).length)hit(lowest(foes),.85)}
let chooseSlot=0,beastIndex=0;
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act,id=Number(el.dataset.id);if(act==='closeOutside'&&e.target!==el)return;switch(act){case 'page':page=el.dataset.page;modal='';battle=null;if(page==='battle')S.storyMode='story';break;case 'filter':filter=el.dataset.value;break;case 'detail':selected=id;modal='hero';break;case 'selectHero':selected=id;break;case 'tab':atab=el.dataset.value;break;case 'draw1':summon(1);return;case 'draw10':summon(10);return;case 'close':case 'closeOutside':modal='';break;case 'ascend':ascend();return;case 'level':level();return;case 'toggleTeam':toggleTeam();return;case 'autoTeam':autoTeam();return;case 'goBattle':page='battle';battle=null;break;case 'goTeam':page='team';break;case 'goBeast':page='home';atab='beasts';break;case 'heroHome':page='home';atab='artifact';modal='';break;case 'upArtifact':upArtifact();return;case 'forge':forge();return;case 'gearBag':modal='bag';break;case 'chooseGear':chooseSlot=Number(el.dataset.slot);modal='chooseGear';break;case 'equip':equip(id);return;case 'upGear':upGear(Number(el.dataset.slot));return;case 'beastDraw':beastDraw();return;case 'beastDetail':beastIndex=id;modal='beast';break;case 'beastUp':beastUp();return;case 'beastToggle':beastToggle();return;case 'autoBeast':autoBeast();return;case 'startFight':S.storyMode='story';startBattle();return;case 'towerBattle':S.storyMode='tower';page='battle';startBattle();return;case 'claimDaily':claimDaily();return;case 'claimOffline':claimOffline();return;case 'claimMedal':claimMedal(el.dataset.name);return;case 'oneRound':doTurn(battle);break;case 'autoFight':for(let i=0;i<38&&!battle.over;i++)doTurn(battle);break;case 'resetFight':battle=null;if(S.storyMode==='tower')page='cultivate';break;case 'retryFight':startBattle();return;default:return}render()});render();
})();
