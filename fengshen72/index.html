 if(path==='frost'&&a.fx==='freeze')ch++;
 if(path==='sword'&&(['mark','break'].includes(a.fx)||a.kind==='chain'))ch++;
 if(path==='thunder'&&(['shock','burn'].includes(a.fx)))ch++;
 if(path==='bulwark'&&(['guard','reflect','counter','shield'].includes(a.fx)||a.kind==='guard'))ch++;
 if(path==='lotus'&&(['heal','cleanse','regen','revive'].includes(a.fx)||a.kind==='heal'))ch++;
 if(ch>=2){ch-=2;
  if(path==='flame'&&bomb.length){for(const t of bomb)damage(t,t.max*.085,log,'🔥道统·离火燃爆',false,a)}
  else if(path==='frost'){addStatus(foe,'易伤',2);log.push('❄道统·玄冰碎甲：目标易伤')}
  else if(path==='sword')damage(foe,a.atk*1.65,log,'⚔道统·万剑归宗',false,a);
  else if(path==='thunder')e.slice(0,3).forEach(x=>damage(x,a.atk*.75,log,'⚡道统·九霄过载',false,a));
  else if(path==='bulwark'){for(const x of g){x.status['护盾值']=(x.status['护盾值']||0)+a.atk*.8;addStatus(x,'反震',2)}log.push('🛡道统·玄武反震：护盾加强')}

 }

}

document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let act=el.dataset.act,id=Number(el.dataset.id);if(act==='closeOutside'&&e.target!==el)return;switch(act){case 'page':page=el.dataset.page;window.scrollTo({top:0,behavior:'instant'});modal='';battle=null;if(page==='battle')S.storyMode='story';break;case 'filter':filter=el.dataset.value;break;case 'detail':selected=id;modal='hero';break;case 'selectHero':selected=id;break;case 'tab':atab=el.dataset.value;break;case 'draw1':summon(1);return;case 'draw10':summon(10);return;case 'close':case 'closeOutside':modal='';break;case 'installHelp':modal='install';break;case 'exportSave':exportSave();return;case 'importSave':document.getElementById('fs-import').click();return;case 'pathTeam':pickPath(el.dataset.path);return;case 'ascend':ascend();return;case 'level':level();return;case 'toggleTeam':toggleTeam();return;case 'autoTeam':autoTeam();return;case 'goBattle':page='battle';window.scrollTo({top:0,behavior:'instant'});battle=null;break;case 'goTeam':page='team';window.scrollTo({top:0,behavior:'instant'});break;case 'goBeast':page='home';window.scrollTo({top:0,behavior:'instant'});atab='beasts';break;case 'heroHome':page='home';window.scrollTo({top:0,behavior:'instant'});atab='artifact';modal='';break;case 'upArtifact':upArtifact();return;case 'forge':forge();return;case 'gearBag':modal='bag';break;case 'chooseGear':chooseSlot=Number(el.dataset.slot);modal='chooseGear';break;case 'equip':equip(id);return;case 'upGear':upGear(Number(el.dataset.slot));return;case 'beastDraw':beastDraw();return;case 'beastDetail':beastIndex=id;modal='beast';break;case 'beastUp':beastUp();return;case 'beastToggle':beastToggle();return;case 'autoBeast':autoBeast();return;case 'startFight':S.storyMode='story';startBattle();return;case 'towerBattle':S.storyMode='tower';page='battle';startBattle();return;case 'claimDaily':claimDaily();return;case 'claimOffline':claimOffline();return;case 'claimMedal':claimMedal(el.dataset.name);return;case 'oneRound':doTurn(battle);break;case 'autoFight':for(let i=0;i<38&&!battle.over;i++)doTurn(battle);break;case 'resetFight':battle=null;if(S.storyMode==='tower')page='cultivate';break;case 'retryFight':startBattle();return;default:return}render()});render();
})();
