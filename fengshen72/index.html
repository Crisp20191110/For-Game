.spell-trail.spell-good{transform-origin:center;--direction:-1}.spell-trail.spell-enemy{--direction:1}.spell-trail.fx-freeze{background:linear-gradient(transparent,#c1f4ff,#6ab6f9);box-shadow:0 0 18px #4ca9ff}.spell-trail.fx-shock{background:linear-gradient(transparent,#ddaaff,#8556e6);box-shadow:0 0 16px #a579ff}
.battle-cast-name{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:#f5d7a0;text-shadow:0 0 5px #000,0 0 9px #000;opacity:0;pointer-events:none;animation:fsCastName 900ms ease-out var(--fx-delay,0s) both}
@keyframes fsCast{0%{opacity:0;transform:scale(.92)}23%{opacity:1;transform:scale(1.12)}65%{opacity:.75}100%{opacity:0;transform:scale(1.03)}}
@keyframes fsNumber{0%{opacity:0;transform:translate(-50%,12px) scale(.7)}25%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}70%{opacity:1;transform:translate(-50%,-16px)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
@keyframes fsSpellTrail{0%{opacity:0;translate:-50% 29px;scale:.3;rotate:-32deg}20%{opacity:1;scale:1.3}65%{opacity:1;translate:-50% -27px;rotate:21deg}100%{opacity:0;translate:-50% -35px;scale:.3}}
@keyframes fsCastName{0%{opacity:0;transform:translateY(10px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.combat-attack-flash,.combat-damage-pop,.combat-heal-pop,.spell-trail,.battle-cast-name{animation-duration:0.01ms!important;animation-delay:0s!important}}

/* Skill motion: attackers move toward the opposing side; victims shake on impact. */

@keyframes fsLunge{0%,100%{transform:translateY(0) scale(1);filter:brightness(1)}24%{transform:translateY(-7px) scale(1.08);filter:brightness(1.45)}50%{transform:translateY(3px) scale(.96);filter:brightness(1.18)}}
@keyframes fsImpact{0%,100%{transform:translateX(0);filter:brightness(1)}20%{transform:translateX(-4px) rotate(-1.6deg);filter:brightness(1.85)}40%{transform:translateX(4px) rotate(1.6deg)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
