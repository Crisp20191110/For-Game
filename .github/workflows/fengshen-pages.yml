name: Deploy Fengshen iPhone Web App
on:
  push:
    branches: [main]
    paths:
      - "fengshen72/**"
      - ".github/workflows/fengshen-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fengshen-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fengshen72
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
